name: Databricks Bundle Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Check Authentication
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PAT }}
        run: |
          echo "Testing authentication..."
          databricks current-user me || {
            echo "❌ Authentication failed!"
            echo "Check that secrets DATABRICKS_WORKSPACE_URL and DATABRICKS_PAT are set correctly"
            exit 1
          }

      - name: Validate Bundle
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PAT }}
        run: |
          echo "Validating bundle..."
          databricks bundle validate -t dev

      - name: Deploy Bundle
        # Only deploy on push to main, not on PRs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_WORKSPACE_URL }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_PAT }}
        run: |
          # --no-lock skips lock file checks for concurrent deployments
          databricks bundle deploy -t dev --no-lock

      - name: Deployment Summary
        if: success() && github.event_name == 'push'
        run: |
          echo "✅ Bundle deployed successfully to dev target"
          echo "📦 Bundle: rearc-data-quest-databricks"
          echo "🎯 Target: dev"
          echo "🌐 Workspace: ${{ secrets.DATABRICKS_WORKSPACE_URL }}"